<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flashcard & Quiz Tiếng Nhật N2</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="N2">
<meta name="theme-color" content="#1e1e1e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1a1a1a; --head:#1e1e1e; --sub:#161616; --card:#242424; --card-2:#2a2a2a; --chip:#282828;
  --line:#333; --line-2:#282828; --text:#e8e8e8; --text-2:#b5b5b5; --muted:#8a8a8a;
  --gold:#d4af37; --gold-l:#f0d060; --gold-d:#a8862a; --green:#4caf7d; --blue:#5b9de0; --red:#e05b5b; --purple:#c084e0;
  --jp:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,"Noto Sans JP",system-ui,sans-serif;font-size:15px;line-height:1.5}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;touch-action:manipulation}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.jp{font-family:var(--jp)}
.app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}

/* header */
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));background:var(--head);border-bottom:1px solid var(--line-2);position:sticky;top:0;z-index:20}
.logo{font-family:var(--jp);font-weight:900;color:var(--gold);font-size:20px;letter-spacing:.05em;white-space:nowrap}
.logo span{color:#fff}
.crumb{color:var(--muted);font-size:12px;display:none}
.crumb b{color:var(--gold)}
@media(min-width:900px){.crumb{display:block}}
.seg{display:flex;gap:4px;padding:4px;background:var(--chip);border:1px solid var(--line);border-radius:12px}
.seg button{padding:6px 14px;border-radius:8px;font-size:13px;font-weight:700;color:var(--text-2);transition:.15s;white-space:nowrap}
.seg button:hover{color:#fff}
.seg button.on{background:var(--gold);color:var(--bg);box-shadow:0 2px 8px rgba(212,175,55,.25)}

/* sub bar */
.subbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 16px;background:var(--sub);border-bottom:1px solid #262626}
.subbar .grow{flex:1}
.ctl{padding:7px 12px;border-radius:9px;font-size:13px;font-weight:700;border:1px solid var(--line);background:var(--card);color:var(--text-2);transition:.15s;white-space:nowrap}
.ctl:hover{color:#fff}
select.ctl{color:var(--gold);padding-right:28px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.ctl.rev{background:#2e1a3e;border-color:#7c4d9f;color:var(--purple)}
.ctl.shuf{background:#1a2e1a;border-color:var(--green);color:var(--green)}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--text-2);cursor:pointer;user-select:none}
.chk.on{color:var(--gold)}
.chk input{accent-color:var(--gold);width:15px;height:15px}

/* unit dropdown */
.dd{position:relative}
.dd-btn{color:var(--gold)}
.dd-panel{position:absolute;top:calc(100% + 6px);left:0;z-index:30;width:min(340px,calc(100vw - 32px));max-height:min(420px,70vh);display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 40px rgba(0,0,0,.5);overflow:hidden}
.dd-top{display:flex;gap:8px;padding:10px;border-bottom:1px solid var(--line)}
.dd-top button{flex:1;padding:6px;border-radius:8px;font-size:12px;font-weight:700;background:var(--chip);border:1px solid var(--line);color:var(--text-2)}
.dd-top button:hover{color:var(--gold)}
.dd-list{overflow-y:auto;padding:6px}
.dd-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px}
.dd-item:hover{background:var(--card-2)}
.dd-item input{accent-color:var(--gold);width:15px;height:15px;flex:none}
.dd-item .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-item .c{font-size:11px;color:var(--muted)}
.dd-item .c b{color:var(--green);font-weight:600}

main{flex:1;display:flex;flex-direction:column;width:100%}
.stage{width:100%;max-width:720px;margin:0 auto;padding:20px 16px max(40px,env(safe-area-inset-bottom))}

/* progress */
.prog{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted);margin-bottom:14px}
.bar{flex:1;height:6px;border-radius:99px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-d),var(--gold-l));border-radius:99px;transition:width .25s}
.prog .lc{color:var(--green);font-weight:600}

/* flashcard */
.fc{perspective:1400px;cursor:pointer;user-select:none}
.fc-in{position:relative;min-height:440px;transition:transform .45s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:auto;scrollbar-width:thin;scrollbar-color:#444 transparent;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.face.back{transform:rotateY(180deg);justify-content:flex-start}
.face .tag{position:absolute;top:14px;left:16px;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.face .learned{position:absolute;top:12px;right:14px;font-size:11px;font-weight:700;color:var(--green);background:#1a2e1a;border:1px solid #2f5e43;padding:2px 8px;border-radius:99px}
.face .hint{position:absolute;bottom:14px;left:0;right:0;font-size:11px;color:#666}
.big{font-family:var(--jp);font-weight:700;color:#fff;line-height:1.2;word-break:keep-all}
.big.k{font-size:120px}
.big.w{font-size:clamp(40px,11vw,64px)}
.big.g{font-size:clamp(30px,8vw,46px);color:var(--gold-l)}
.big.vi{font-family:Inter,sans-serif;font-size:clamp(22px,6vw,30px);font-weight:700;color:#fff}
.hv{color:var(--gold);font-weight:800;letter-spacing:.08em;font-size:15px;margin-top:6px}
.read{font-family:var(--jp);color:var(--blue);font-size:22px;font-weight:500}
.mean{font-size:20px;font-weight:700;color:#fff;margin-top:6px}
.back-head{display:flex;flex-direction:column;align-items:center;gap:2px;padding-top:14px;margin-bottom:14px}
.back-head .big.k{font-size:64px}
.back-head .big.w{font-size:40px}
.rows{width:100%;text-align:left;display:flex;flex-direction:column;gap:10px}
.row{background:#1e1e1e;border:1px solid var(--line-2);border-radius:12px;padding:10px 14px}
.row .lb{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.row .jp{font-size:17px}
.ex{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;padding:4px 0;border-bottom:1px dashed var(--line)}
.ex:last-child{border-bottom:0}
.ex .w{font-family:var(--jp);font-weight:700;color:#fff;font-size:17px}
.ex .r{font-family:var(--jp);color:var(--blue);font-size:14px}
.ex .m{color:var(--text-2);font-size:14px}
ruby{ruby-position:over}
rt{font-size:.55em;color:var(--blue);font-family:var(--jp)}
.mask rt,.mask .mk{background:repeating-linear-gradient(45deg,#444,#444 6px,#333 6px,#333 12px);color:transparent;border-radius:3px;cursor:pointer}
.mk{display:inline-block;min-width:3em;padding:0 4px}
.mask.shown rt,.mask.shown .mk{background:none;color:var(--blue)}
.mask.shown .mk{color:var(--text-2)}

.nav{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.nb{padding:11px 18px;border-radius:12px;font-weight:700;font-size:14px;background:var(--card);border:1px solid var(--line);color:var(--text-2);transition:.15s}
.nb:hover:not(:disabled){color:#fff;border-color:#444}
.nb:disabled{opacity:.35;cursor:default}
.nb.know{background:#1a2e1a;border-color:var(--green);color:var(--green)}
.nb.know.on{background:var(--green);color:#0f1f15}
.nb.gold{background:var(--gold);border-color:var(--gold);color:var(--bg)}
.nb.gold:hover{background:var(--gold-l)}
.nb.ico{padding:11px 14px}
.keys{text-align:center;font-size:11px;color:#5e5e5e;margin-top:14px}
.keys kbd{font-family:inherit;background:var(--chip);border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--text-2)}
@media(hover:none){.keys{display:none}}

/* empty */
.empty{text-align:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:36px 22px;margin-top:20px}
.empty .e{font-size:38px;margin-bottom:8px}
.empty h3{font-size:16px;margin-bottom:6px}
.empty p{color:var(--muted);font-size:13px;margin-bottom:16px}

/* list */
.search{width:100%;padding:11px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);margin-bottom:12px;outline:none}
.search:focus{border-color:var(--gold-d)}
.li{display:flex;align-items:center;gap:14px;padding:11px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line-2);margin-bottom:6px;cursor:pointer;transition:.12s}
.li:hover{border-color:#444;background:var(--card-2)}
.li.cur{border-color:var(--gold-d)}
.li .no{font-size:11px;color:#666;width:30px;flex:none;text-align:right}
.li .a{font-family:var(--jp);font-weight:700;font-size:18px;color:#fff;min-width:64px;flex:none}
.li .b{flex:1;min-width:0}
.li .b .r{font-family:var(--jp);font-size:13px;color:var(--blue)}
.li .b .m{font-size:13px;color:var(--text-2)}
.li .b .h{font-size:11px;color:var(--gold);font-weight:700;letter-spacing:.05em}
.li .ok{width:26px;height:26px;flex:none;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:13px;color:transparent}
.li .ok.on{background:var(--green);border-color:var(--green);color:#0f1f15}
.cnt{font-size:12px;color:var(--muted);margin-bottom:10px}

/* quiz */
.qset{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:16px}
.qset h2{font-size:18px}
.qset .lbl{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{padding:7px 13px;border-radius:9px;font-size:13px;font-weight:700;background:var(--chip);border:1px solid var(--line);color:var(--text-2)}
.pill.on{background:var(--gold);border-color:var(--gold);color:var(--bg)}
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-bottom:10px}
.qhead .sc{color:var(--green);font-weight:700}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:30px 20px 24px;text-align:center;margin-bottom:14px;position:relative}
.qcard .tag{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
.qcard .sub{margin-top:8px;min-height:22px}
.qcard .spk{position:absolute;top:12px;right:12px}
.opts{display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:560px){.opts{grid-template-columns:1fr 1fr}}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:14px 16px;border-radius:14px;background:var(--card);border:1px solid var(--line);transition:.12s;min-height:58px}
.opt:hover:not(:disabled){border-color:var(--gold-d);background:var(--card-2)}
.opt .n{width:26px;height:26px;border-radius:8px;background:var(--chip);display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--muted);flex:none}
.opt .x{flex:1}
.opt .x.jp{font-size:20px;font-weight:700}
.opt.right{border-color:var(--green);background:#1a2e1a}
.opt.right .n{background:var(--green);color:#0f1f15}
.opt.wrong{border-color:var(--red);background:#2e1a1a}
.opt.wrong .n{background:var(--red);color:#1f0f0f}
.opt:disabled{cursor:default}
.fb{margin-top:14px;padding:14px 16px;border-radius:14px;background:#1e1e1e;border:1px solid var(--line-2);font-size:14px;color:var(--text-2)}
.fb b{color:#fff}
.res{text-align:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:30px 20px}
.res .pct{font-size:56px;font-weight:800;color:var(--gold)}
.res .msg{color:var(--text-2);margin:4px 0 18px}
.wl{margin-top:18px;text-align:left}
.wl h4{font-size:13px;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em}
.wl .li{cursor:default}

@media(max-width:600px){
  header{flex-wrap:wrap}
  header .seg{width:100%}
  .seg button{padding:7px 6px;flex:1}
  .subbar .grow{display:none}
  .nav .nb{flex:1 1 auto}
  .nav .nb.ico{flex:0 0 auto}
  .big.k{font-size:96px}
  .fc-in{min-height:420px}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div style="display:flex;align-items:center;gap:14px">
      <div class="logo">日語<span>N2</span></div>
      <div class="crumb" id="crumb"></div>
    </div>
    <div class="seg" id="modes">
      <button data-m="card">🃏 Thẻ</button>
      <button data-m="list">📋 Danh sách</button>
      <button data-m="quiz">🎯 Ôn tập</button>
    </div>
  </header>
  <div class="subbar" id="subbar"></div>
  <main><div class="stage" id="stage"></div></main>
</div>

<script src="data.js"></script>
<script>
(() => {
const D = window.N2_DATA;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const shuffle = a => { a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ---------- build decks: type -> [{id,label,cards}] ---------- */
const TYPES = {
  kanji:   {label:'Hán Tự',   icon:'字', unit:'Nhóm'},
  vocab:   {label:'Từ Vựng',  icon:'語', unit:'Trang'},
  grammar: {label:'Ngữ Pháp', icon:'文', unit:'Chương'}
};
const UNITS = {kanji:[], vocab:[], grammar:[]};
(() => {
  const byK = {};
  D.kanji.forEach(k => (byK[k.g] ||= []).push({...k, _t:'kanji', id:'k' + k.k, _u:k.g}));
  Object.keys(byK).map(Number).sort((a,b) => a - b).forEach(g => UNITS.kanji.push({id:g, label:'Nhóm ' + g, cards:byK[g]}));
  const byV = {};
  D.vocab.forEach(v => (byV[v.page] ||= []).push({...v, _t:'vocab', id:'v' + v.n, _u:v.page}));
  Object.keys(byV).map(Number).sort((a,b) => a - b).forEach(p => UNITS.vocab.push({id:p, label:'Trang ' + p, cards:byV[p]}));
  D.grammar.forEach(c => UNITS.grammar.push({id:c.n, label:'Chương ' + c.n + ' · ' + c.t, cards:c.items.map(i => ({...i, _t:'grammar', id:'g' + i.id, _u:c.n}))}));
})();
const ALL = {kanji:UNITS.kanji.flatMap(u => u.cards), vocab:UNITS.vocab.flatMap(u => u.cards), grammar:UNITS.grammar.flatMap(u => u.cards)};

/* ---------- state ---------- */
const S = {
  mode: store.get('n2w-mode', 'card'),
  type: store.get('n2w-type', 'kanji'),
  units: store.get('n2w-units', {kanji:[1], vocab:[1], grammar:[1]}),
  reverse: store.get('n2w-rev', false),
  shuffled: false, order: null,
  onlyNew: false,
  idx: 0, flip: false,
  search: '',
  ddOpen: false,
  quiz: null,
  qdir: store.get('n2w-qdir', 'jv'),
  qcount: store.get('n2w-qcount', 20),
  qkanji: store.get('n2w-qkanji', 'all')
};
if(!TYPES[S.type]) S.type = 'kanji';
const known = new Set(store.get('n2w-known', []));
const saveKnown = () => store.set('n2w-known', [...known]);
const saveState = () => { store.set('n2w-mode', S.mode); store.set('n2w-type', S.type); store.set('n2w-units', S.units); store.set('n2w-rev', S.reverse); };

const selUnits = () => (S.units[S.type] || []);
function baseCards(){
  const set = new Set(selUnits());
  return UNITS[S.type].filter(u => set.has(u.id)).flatMap(u => u.cards);
}
function activeCards(){
  let c = baseCards();
  if(S.shuffled){
    if(!S.order || S.order.key !== c.map(x => x.id).join()) S.order = {key:c.map(x => x.id).join(), ids:shuffle(c.map(x => x.id))};
    const m = new Map(c.map(x => [x.id, x]));
    c = S.order.ids.map(id => m.get(id));
  }
  if(S.onlyNew) c = c.filter(x => !known.has(x.id));
  return c;
}

/* ---------- speech ---------- */
let jaVoice = null;
function pickVoice(){ try{ jaVoice = speechSynthesis.getVoices().find(v => /^ja/i.test(v.lang)) || null; }catch(e){} }
if(window.speechSynthesis){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text){
  if(!window.speechSynthesis || !text) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/[〜～]/g, ''));
  u.lang = 'ja-JP'; u.rate = .9; if(jaVoice) u.voice = jaVoice;
  speechSynthesis.speak(u);
}
const speakText = c => c._t === 'kanji' ? (c.ex?.[0]?.w || c.k) : c._t === 'vocab' ? (c.k || c.w) : (c.j || c.p);

/* ---------- render helpers ---------- */
const ruby = parts => (parts || []).map(([t, r]) => r ? `<ruby>${esc(t)}<rt>${esc(r)}</rt></ruby>` : esc(t)).join('');
const plain = c => c._t === 'kanji' ? c.k : c._t === 'vocab' ? c.w : c.p;
const meaningOf = c => c.m;

function frontHTML(c){
  const unit = TYPES[c._t].unit + ' ' + c._u;
  if(S.reverse){
    const sub = c._t === 'kanji' ? `<div class="hv">${esc(c.hv)}</div>` : c._t === 'vocab' && c.hv ? `<div class="hv">${esc(c.hv)}</div>` : '';
    return `<span class="tag">${unit} · Việt → Nhật</span><div class="big vi">${esc(c.m)}</div>${sub}`;
  }
  if(c._t === 'kanji') return `<span class="tag">${unit}</span><div class="big k">${esc(c.k)}</div>`;
  if(c._t === 'vocab') return `<span class="tag">${unit}</span><div class="big w">${esc(c.w)}</div>`;
  return `<span class="tag">${unit}</span><div class="big g">${esc(c.p)}</div><div style="margin-top:12px;color:var(--muted);font-size:14px" class="jp">${esc(c.s)}</div>`;
}
function backHTML(c){
  if(c._t === 'kanji'){
    const ex = (c.ex || []).map(e => `<div class="ex"><span class="w">${esc(e.w)}</span><span class="r">${esc(e.r)}</span><span class="m">${esc(e.m)}</span></div>`).join('');
    return `<div class="back-head"><div class="big k">${esc(c.k)}</div><div class="hv">${esc(c.hv)}</div><div class="mean">${esc(c.m)}</div></div>
      <div class="rows">
        ${c.on?.length ? `<div class="row"><div class="lb">Âm On</div><div class="jp">${esc(c.on.join('、'))}</div></div>` : ''}
        ${c.kun?.length ? `<div class="row"><div class="lb">Âm Kun</div><div class="jp">${esc(c.kun.join('、'))}</div></div>` : ''}
        ${ex ? `<div class="row"><div class="lb">Từ ví dụ</div>${ex}</div>` : ''}
      </div>`;
  }
  if(c._t === 'vocab'){
    return `<div class="back-head" style="margin:auto 0"><div class="big w">${esc(c.w)}</div>
      ${c.k && c.k !== c.w ? `<div class="read">${esc(c.k)}</div>` : ''}
      ${c.hv ? `<div class="hv">${esc(c.hv)}</div>` : ''}
      <div class="mean" style="font-size:24px;margin-top:12px">${esc(c.m)}</div></div>`;
  }
  return `<div class="back-head"><div class="big g">${esc(c.p)}</div><div class="mean">${esc(c.m)}</div></div>
    <div class="rows">
      <div class="row"><div class="lb">Cấu trúc</div><div class="jp">${esc(c.s)}</div></div>
      <div class="row"><div class="lb">Ví dụ <span style="text-transform:none;font-weight:500">(chạm để hiện furigana / nghĩa)</span></div>
        <div class="jp mask" data-mask style="font-size:18px;line-height:2.1">${c.jf ? ruby(c.jf) : esc(c.j)}</div>
        <div class="mask" data-mask style="margin-top:4px"><span class="mk">${esc(c.v)}</span></div>
      </div>
    </div>`;
}

/* ---------- sub bar ---------- */
function renderSub(){
  const units = UNITS[S.type], sel = new Set(selUnits());
  const unitLabel = sel.size === 0 ? 'Chưa chọn ' + TYPES[S.type].unit.toLowerCase()
    : sel.size === 1 ? units.find(u => u.id === [...sel][0])?.label.split(' · ')[0]
    : sel.size === units.length ? 'Tất cả ' + TYPES[S.type].unit.toLowerCase() : `Đã chọn ${sel.size} ${TYPES[S.type].unit.toLowerCase()}`;
  const dd = S.ddOpen ? `<div class="dd-panel" id="ddp">
      <div class="dd-top"><button data-dd="all">Chọn tất cả</button><button data-dd="none">Bỏ chọn</button><button data-dd="new">Còn chưa thuộc</button></div>
      <div class="dd-list">${units.map(u => {
        const k = u.cards.filter(c => known.has(c.id)).length;
        return `<label class="dd-item"><input type="checkbox" data-u="${u.id}" ${sel.has(u.id) ? 'checked' : ''}><span class="t">${esc(u.label)}</span><span class="c"><b>${k}</b>/${u.cards.length}</span></label>`;
      }).join('')}</div></div>` : '';
  const flashOnly = S.mode !== 'quiz' ? `
    <div class="grow"></div>
    <button class="ctl ${S.reverse ? 'rev' : ''}" id="rev">🔄 ${S.reverse ? 'Việt → Nhật' : 'Nhật → Việt'}</button>
    <label class="chk ${S.onlyNew ? 'on' : ''}"><input type="checkbox" id="onlyNew" ${S.onlyNew ? 'checked' : ''}> Chỉ thẻ chưa thuộc</label>
    <button class="ctl ${S.shuffled ? 'shuf' : ''}" id="shuf">🔀 Trộn thẻ</button>` : '';
  $('#subbar').innerHTML = `
    <select class="ctl" id="type">${Object.entries(TYPES).map(([k, t]) => `<option value="${k}" ${k === S.type ? 'selected' : ''}>${t.icon} ${t.label} (${ALL[k].length})</option>`).join('')}</select>
    <div class="dd"><button class="ctl dd-btn" id="ddb">📅 ${esc(unitLabel)} ▾</button>${dd}</div>
    ${flashOnly}`;
  $('#crumb').innerHTML = `${TYPES[S.type].label} / <b>${esc(unitLabel)}</b> (${baseCards().length} thẻ)`;
  document.querySelectorAll('#modes button').forEach(b => b.classList.toggle('on', b.dataset.m === S.mode));
}

/* ---------- views ---------- */
function renderCard(){
  const cards = activeCards();
  if(!cards.length) return emptyHTML();
  S.idx = Math.max(0, Math.min(S.idx, cards.length - 1));
  const c = cards[S.idx], isK = known.has(c.id);
  const lc = baseCards().filter(x => known.has(x.id)).length;
  return `
    <div class="prog"><span>${S.idx + 1} / ${cards.length}</span><div class="bar"><i style="width:${(S.idx + 1) / cards.length * 100}%"></i></div><span class="lc">✓ ${lc}/${baseCards().length}</span></div>
    <div class="fc ${S.flip ? 'flip' : ''}" id="fc"><div class="fc-in">
      <div class="face front">${frontHTML(c)}${isK ? '<span class="learned">✓ Đã thuộc</span>' : ''}<span class="hint">Chạm để lật thẻ</span></div>
      <div class="face back">${backHTML(c)}</div>
    </div></div>
    <div class="nav">
      <button class="nb" id="prev" ${S.idx === 0 ? 'disabled' : ''}>← Trước</button>
      <button class="nb ico" id="spk" title="Phát âm">🔊</button>
      <button class="nb know ${isK ? 'on' : ''}" id="know">${isK ? '✓ Đã thuộc' : '☐ Đánh dấu thuộc'}</button>
      <button class="nb gold" id="next" ${S.idx >= cards.length - 1 ? 'disabled' : ''}>Sau →</button>
    </div>
    <div class="keys"><kbd>Space</kbd> lật · <kbd>←</kbd><kbd>→</kbd> chuyển · <kbd>M</kbd> đánh dấu thuộc · <kbd>S</kbd> phát âm · <kbd>R</kbd> đảo chiều</div>`;
}
function emptyHTML(){
  const none = selUnits().length === 0;
  return `<div class="empty"><div class="e">${none ? '📅' : '🎉'}</div>
    <h3>${none ? 'Chưa chọn ' + TYPES[S.type].unit.toLowerCase() + ' nào' : S.onlyNew ? 'Bạn đã thuộc hết thẻ trong phần này!' : 'Không có thẻ nào.'}</h3>
    <p>${none ? 'Chọn ít nhất một ' + TYPES[S.type].unit.toLowerCase() + ' ở thanh phía trên để bắt đầu học.' : 'Xuất sắc! Chuyển sang "Ôn tập" để kiểm tra hoặc chọn thêm phần khác.'}</p>
    ${none ? `<button class="nb gold" data-pick-first>Chọn ${esc(UNITS[S.type][0].label.split(' · ')[0])}</button>` : `<button class="nb gold" data-go-quiz>🎯 Ôn tập ngay</button>`}</div>`;
}
function listRow(c, i, cur){
  const a = plain(c);
  const sub = c._t === 'kanji' ? `<div class="h">${esc(c.hv)}</div><div class="m">${esc(c.m)}</div>`
    : c._t === 'vocab' ? `<div class="r">${c.k !== c.w ? esc(c.k) : ''}${c.hv ? ` <span class="h">${esc(c.hv)}</span>` : ''}</div><div class="m">${esc(c.m)}</div>`
    : `<div class="r">${esc(c.s)}</div><div class="m">${esc(c.m)}</div>`;
  return `<div class="li ${cur ? 'cur' : ''}" data-jump="${i}"><span class="no">${i + 1}</span><span class="a">${esc(a)}</span><div class="b">${sub}</div><button class="ok ${known.has(c.id) ? 'on' : ''}" data-tog="${esc(c.id)}" title="Đánh dấu thuộc">✓</button></div>`;
}
function renderList(){
  const cards = activeCards();
  if(!cards.length) return emptyHTML();
  const q = S.search.trim().toLowerCase();
  const rows = cards.map((c, i) => [c, i]).filter(([c]) => !q || [plain(c), c.m, c.k, c.hv, c.s, c.r].some(x => String(x || '').toLowerCase().includes(q)));
  return `<input class="search" id="search" placeholder="🔍 Tìm chữ Hán, cách đọc, Hán Việt, nghĩa..." value="${esc(S.search)}">
    <div class="cnt">${rows.length} / ${cards.length} thẻ · ✓ ${cards.filter(c => known.has(c.id)).length} đã thuộc</div>
    <div id="rows">${rows.map(([c, i]) => listRow(c, i, i === S.idx)).join('')}</div>`;
}

/* ---------- quiz ---------- */
function quizItems(){
  const out = [];
  baseCards().forEach(c => {
    if(c._t === 'kanji'){
      if(S.qkanji !== 'compound') out.push({id:c.id, jp:c.k, vi:c.m, hv:c.hv, read:[...(c.on || []), ...(c.kun || [])].join('、'), t:'kanji', tag:`Hán tự · Nhóm ${c._u}`, src:c});
      if(S.qkanji !== 'single') (c.ex || []).forEach((e, j) => e.w && e.m && out.push({id:c.id + '-' + j, jp:e.w, vi:e.m, hv:'', read:e.r, t:'kword', tag:`Từ ghép của ${c.k} · Nhóm ${c._u}`, src:c}));
    } else if(c._t === 'vocab'){
      out.push({id:c.id, jp:c.w, vi:c.m, hv:c.hv, read:c.k !== c.w ? c.k : '', t:'vocab', tag:`Từ vựng · Trang ${c._u}`, src:c});
    } else {
      out.push({id:c.id, jp:c.p, vi:c.m, hv:'', read:c.s, t:'grammar', tag:`Ngữ pháp · Chương ${c._u}`, src:c});
    }
  });
  return out;
}
function distractorPool(item){
  // same kind of answers, preferring the whole level of that type
  if(item.t === 'kanji') return ALL.kanji.map(k => ({jp:k.k, vi:k.m}));
  if(item.t === 'kword') return ALL.kanji.flatMap(k => (k.ex || []).map(e => ({jp:e.w, vi:e.m})));
  if(item.t === 'vocab') return ALL.vocab.map(v => ({jp:v.w, vi:v.m}));
  return ALL.grammar.map(g => ({jp:g.p, vi:g.m}));
}
function buildQuestion(item){
  const key = S.qdir === 'jv' ? 'vi' : 'jp';
  const right = item[key];
  const seen = new Set([right.trim()]);
  const wrong = [];
  for(const p of shuffle(distractorPool(item))){
    const v = p[key]; if(!v || seen.has(v.trim()) || p.jp === item.jp) continue;
    seen.add(v.trim()); wrong.push(v); if(wrong.length === 3) break;
  }
  const opts = shuffle([right, ...wrong]);
  return {item, opts, ans:opts.indexOf(right), picked:null};
}
function startQuiz(list){
  let items = list || quizItems();
  items = shuffle(items);
  if(!list && S.qcount && items.length > S.qcount) items = items.slice(0, S.qcount);
  S.quiz = {qs:items.map(buildQuestion), i:0, score:0, done:false, started:true};
  render();
}
function renderQuiz(){
  const Q = S.quiz;
  if(!Q || !Q.started){
    const n = quizItems().length;
    return `<div class="qset">
      <h2>🎯 Ôn tập trắc nghiệm</h2>
      <div><div class="lbl">Chiều câu hỏi</div><div class="pills">
        <button class="pill ${S.qdir === 'jv' ? 'on' : ''}" data-qdir="jv">Nhật → Việt</button>
        <button class="pill ${S.qdir === 'vj' ? 'on' : ''}" data-qdir="vj">Việt → Nhật</button></div></div>
      ${S.type === 'kanji' ? `<div><div class="lbl">Loại câu hỏi Kanji</div><div class="pills">
        ${[['all', 'Tất cả'], ['single', 'Chữ đơn'], ['compound', 'Từ ghép']].map(([k, l]) => `<button class="pill ${S.qkanji === k ? 'on' : ''}" data-qk="${k}">${l}</button>`).join('')}</div></div>` : ''}
      <div><div class="lbl">Số câu</div><div class="pills">
        ${[10, 20, 50, 0].map(k => `<button class="pill ${S.qcount === k ? 'on' : ''}" data-qc="${k}">${k || 'Tất cả'}</button>`).join('')}</div></div>
      <div style="color:var(--muted);font-size:13px">Có ${n} câu từ phần đã chọn${S.qcount && n > S.qcount ? ` · sẽ lấy ngẫu nhiên ${S.qcount} câu` : ''}.</div>
      <button class="nb gold" id="qstart" ${n < 1 ? 'disabled' : ''} style="align-self:flex-start">Bắt đầu ▶</button>
    </div>`;
  }
  if(Q.done){
    const pct = Math.round(Q.score / Q.qs.length * 100);
    const wrong = Q.qs.filter(q => q.picked !== q.ans);
    return `<div class="res"><div class="pct">${pct}%</div>
      <div class="msg">Đúng ${Q.score} / ${Q.qs.length} câu · ${pct >= 90 ? 'Tuyệt vời! 🎉' : pct >= 70 ? 'Khá tốt! 💪' : 'Cố gắng thêm nhé! 📚'}</div>
      <div class="nav" style="margin-top:0">
        <button class="nb gold" id="qagain">🔁 Làm lượt mới</button>
        ${wrong.length ? `<button class="nb" id="qwrong">❌ Ôn lại ${wrong.length} câu sai</button>` : ''}
        <button class="nb" id="qsetup">⚙ Cài đặt</button>
      </div>
      ${wrong.length ? `<div class="wl"><h4>Các câu sai</h4>${wrong.map(q => `<div class="li"><span class="a">${esc(q.item.jp)}</span><div class="b"><div class="r">${esc(q.item.read)}${q.item.hv ? ` <span class="h">${esc(q.item.hv)}</span>` : ''}</div><div class="m">${esc(q.item.vi)}</div></div></div>`).join('')}</div>` : ''}
    </div>`;
  }
  const q = Q.qs[Q.i], it = q.item, answered = q.picked != null;
  const showJp = S.qdir === 'jv';
  const prompt = showJp ? `<div class="big ${it.t === 'kanji' ? 'k' : it.t === 'grammar' ? 'g' : 'w'}" style="${it.t === 'kanji' ? 'font-size:96px' : ''}">${esc(it.jp)}</div>`
    : `<div class="big vi">${esc(it.vi)}</div>`;
  const sub = answered ? `<div class="read">${esc(showJp ? it.read : it.jp)}</div>${it.hv ? `<div class="hv">${esc(it.hv)}</div>` : ''}`
    : (!showJp && it.hv ? `<div class="hv">${esc(it.hv)}</div>` : '');
  return `<div class="qhead"><span>Câu ${Q.i + 1} / ${Q.qs.length}</span><span class="sc">✓ ${Q.score}</span></div>
    <div class="bar" style="margin-bottom:14px"><i style="width:${Q.i / Q.qs.length * 100}%"></i></div>
    <div class="qcard"><div class="tag">${esc(it.tag)}</div>${prompt}<div class="sub">${sub}</div>
      <button class="nb ico spk" id="qspk" title="Phát âm">🔊</button></div>
    <div class="opts">${q.opts.map((o, i) => {
      const cls = answered ? (i === q.ans ? 'right' : i === q.picked ? 'wrong' : '') : '';
      return `<button class="opt ${cls}" data-pick="${i}" ${answered ? 'disabled' : ''}><span class="n">${i + 1}</span><span class="x ${showJp ? '' : 'jp'}">${esc(o)}</span></button>`;
    }).join('')}</div>
    ${answered ? `<div class="fb">${q.picked === q.ans ? '✅ <b>Chính xác!</b>' : `❌ Đáp án đúng: <b>${esc(q.opts[q.ans])}</b>`}</div>
      <div class="nav"><button class="nb gold" id="qnext">${Q.i + 1 < Q.qs.length ? 'Câu tiếp →' : 'Xem kết quả'}</button></div>` : ''}
    <div class="keys"><kbd>1</kbd>–<kbd>4</kbd> chọn đáp án · <kbd>Enter</kbd> câu tiếp</div>`;
}
function pick(i){
  const Q = S.quiz, q = Q?.qs[Q.i];
  if(!q || q.picked != null || Q.done) return;
  q.picked = i;
  if(i === q.ans) Q.score++;
  if(S.qdir === 'jv') speak(q.item.jp);
  render();
}
function nextQ(){
  const Q = S.quiz; if(!Q || Q.qs[Q.i].picked == null) return;
  if(Q.i + 1 < Q.qs.length) Q.i++; else Q.done = true;
  render();
}

/* ---------- main render ---------- */
function render(){
  renderSub();
  const st = $('#stage');
  st.innerHTML = S.mode === 'card' ? renderCard() : S.mode === 'list' ? renderList() : renderQuiz();
  if(S.mode === 'list'){
    const cur = st.querySelector('.li.cur');
    if(cur && !S._listScrolled){ cur.scrollIntoView({block:'center'}); S._listScrolled = true; }
  }
}
const resetCard = () => { S.idx = 0; S.flip = false; };
const resetQuiz = () => { S.quiz = null; };

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target;
  const m = t.closest('#modes button');
  if(m){ S.mode = m.dataset.m; S.ddOpen = false; S._listScrolled = false; saveState(); render(); return; }
  if(t.closest('#ddb')){ S.ddOpen = !S.ddOpen; renderSub(); return; }
  if(S.ddOpen && !t.closest('.dd')){ S.ddOpen = false; renderSub(); }
  const dda = t.closest('[data-dd]');
  if(dda){
    const u = UNITS[S.type];
    S.units[S.type] = dda.dataset.dd === 'all' ? u.map(x => x.id) : dda.dataset.dd === 'none' ? [] : u.filter(x => x.cards.some(c => !known.has(c.id))).map(x => x.id);
    resetCard(); resetQuiz(); saveState(); render(); return;
  }
  if(t.closest('#rev')){ S.reverse = !S.reverse; S.flip = false; saveState(); render(); return; }
  if(t.closest('#shuf')){ S.shuffled = !S.shuffled; S.order = null; resetCard(); render(); return; }
  if(t.closest('[data-pick-first]')){ S.units[S.type] = [UNITS[S.type][0].id]; resetCard(); saveState(); render(); return; }
  if(t.closest('[data-go-quiz]')){ S.mode = 'quiz'; resetQuiz(); saveState(); render(); return; }
  const msk = t.closest('[data-mask]');
  if(msk){ msk.classList.toggle('shown'); return; }
  if(t.closest('#fc')){ S.flip = !S.flip; $('#fc').classList.toggle('flip', S.flip); return; }
  if(t.closest('#prev')) return go(-1);
  if(t.closest('#next')) return go(1);
  if(t.closest('#know')) return toggleKnown();
  if(t.closest('#spk')){ const c = activeCards()[S.idx]; c && speak(speakText(c)); return; }
  const tog = t.closest('[data-tog]');
  if(tog){ e.stopPropagation(); const id = tog.dataset.tog; known.has(id) ? known.delete(id) : known.add(id); saveKnown(); tog.classList.toggle('on', known.has(id)); return; }
  const j = t.closest('[data-jump]');
  if(j){ S.idx = +j.dataset.jump; S.flip = false; S.mode = 'card'; saveState(); render(); window.scrollTo(0, 0); return; }
  const qd = t.closest('[data-qdir]'); if(qd){ S.qdir = qd.dataset.qdir; store.set('n2w-qdir', S.qdir); render(); return; }
  const qk = t.closest('[data-qk]'); if(qk){ S.qkanji = qk.dataset.qk; store.set('n2w-qkanji', S.qkanji); render(); return; }
  const qc = t.closest('[data-qc]'); if(qc){ S.qcount = +qc.dataset.qc; store.set('n2w-qcount', S.qcount); render(); return; }
  if(t.closest('#qstart') || t.closest('#qagain')) return startQuiz();
  if(t.closest('#qwrong')) return startQuiz(S.quiz.qs.filter(q => q.picked !== q.ans).map(q => q.item));
  if(t.closest('#qsetup')){ resetQuiz(); render(); return; }
  const pk = t.closest('[data-pick]'); if(pk) return pick(+pk.dataset.pick);
  if(t.closest('#qnext')) return nextQ();
  if(t.closest('#qspk')){ const it = S.quiz?.qs[S.quiz.i]?.item; it && speak(it.jp); return; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.id === 'type'){ S.type = t.value; S.ddOpen = false; resetCard(); resetQuiz(); S.order = null; saveState(); render(); return; }
  if(t.id === 'onlyNew'){ S.onlyNew = t.checked; resetCard(); render(); return; }
  if(t.dataset.u){
    const id = +t.dataset.u, cur = new Set(selUnits());
    t.checked ? cur.add(id) : cur.delete(id);
    S.units[S.type] = UNITS[S.type].map(u => u.id).filter(x => cur.has(x));
    resetCard(); resetQuiz(); saveState(); render(); return;
  }
});
document.addEventListener('input', e => {
  if(e.target.id === 'search'){
    S.search = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const s = $('#search'); s.focus(); s.setSelectionRange(pos, pos);
  }
});
function go(d){
  const n = activeCards().length;
  const i = Math.max(0, Math.min(n - 1, S.idx + d));
  if(i === S.idx) return;
  S.idx = i; S.flip = false; render();
}
function toggleKnown(){
  const c = activeCards()[S.idx]; if(!c) return;
  if(known.has(c.id)) known.delete(c.id); else known.add(c.id);
  saveKnown();
  if(S.onlyNew && known.has(c.id)){ S.flip = false; } else if(known.has(c.id) && S.idx < activeCards().length - 1){ S.idx++; S.flip = false; }
  render();
}
document.addEventListener('keydown', e => {
  if(e.target.matches('input,select,textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
  if(e.key === 'Escape' && S.ddOpen){ S.ddOpen = false; renderSub(); return; }
  if(S.mode === 'card'){
    if(e.key === ' '){ e.preventDefault(); const fc = $('#fc'); if(fc){ S.flip = !S.flip; fc.classList.toggle('flip', S.flip); } }
    else if(e.key === 'ArrowRight') go(1);
    else if(e.key === 'ArrowLeft') go(-1);
    else if(/^[mM]$/.test(e.key)) toggleKnown();
    else if(/^[sS]$/.test(e.key)){ const c = activeCards()[S.idx]; c && speak(speakText(c)); }
    else if(/^[rR]$/.test(e.key)){ S.reverse = !S.reverse; S.flip = false; saveState(); render(); }
  } else if(S.mode === 'quiz' && S.quiz?.started && !S.quiz.done){
    const k = {'1':0, '2':1, '3':2, '4':3, a:0, b:1, c:2, d:3}[e.key.toLowerCase()];
    if(k != null) pick(k);
    else if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); nextQ(); }
  }
});
// swipe on flashcard
let sx = null, sy = null;
document.addEventListener('touchstart', e => { if(e.target.closest('#fc')){ sx = e.touches[0].clientX; sy = e.touches[0].clientY; } }, {passive:true});
document.addEventListener('touchend', e => {
  if(sx == null) return;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
  if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5){ go(dx < 0 ? 1 : -1); }
}, {passive:true});

render();
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
