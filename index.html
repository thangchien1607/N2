<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Ôn luyện N2</title>
<meta name="n2-version" content="5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ôn luyện N2">
<meta name="theme-color" content="#e8e2d6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Noto+Sans+JP:wght@400;500&family=Noto+Serif+JP:wght@500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
<style>
/* Layout: study desk — beige ground, cream paper sheets, navy ink for active controls, ochre for readings and Hán Việt */
:root{
  --bg:#e8e2d6; --paper:#f9f6ee; --paper-2:#f1ebdd; --ink:#1f2433; --ink-2:#4d4f58; --muted:#7b776d;
  --line:#c9c1b1; --dash:#d4c49c; --ochre:#b0823a; --navy:#1c2436; --on-navy:#f9f6ee;
  --good:#4f7a4a; --good-bg:#e3ecd9; --cover:#e6dcc4; --cover-2:#dccfb2;
  --shadow:0 1px 0 rgba(60,50,30,.05),0 8px 24px -12px rgba(60,50,30,.25);
  --f-title:"Source Serif 4","Noto Serif JP",Georgia,serif;
  --f-body:"Be Vietnam Pro","Noto Sans JP",system-ui,sans-serif;
  --f-jp:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
  --f-jp-display:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1b1a17;--paper:#26241f;--paper-2:#2e2b25;--ink:#efe9dc;--ink-2:#c9c2b3;--muted:#958e80;--line:#3e3a32;--dash:#5b4f37;
  --ochre:#d6a75a;--navy:#e9e1cf;--on-navy:#1b1a17;--good:#9cc48f;--good-bg:#2c3a28;--cover:#3a352b;--cover-2:#443e32;
  --shadow:0 8px 24px -12px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1b1a17;--paper:#26241f;--paper-2:#2e2b25;--ink:#efe9dc;--ink-2:#c9c2b3;--muted:#958e80;--line:#3e3a32;--dash:#5b4f37;
  --ochre:#d6a75a;--navy:#e9e1cf;--on-navy:#1b1a17;--good:#9cc48f;--good-bg:#2c3a28;--cover:#3a352b;--cover-2:#443e32;
  --shadow:0 8px 24px -12px rgba(0,0,0,.6);color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,.card,.fg-r,label{touch-action:manipulation}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;margin:0}
.wrap{max-width:920px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left));padding-block:max(24px,env(safe-area-inset-top)) max(64px,calc(env(safe-area-inset-bottom) + 24px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,.fg-r:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
.jp{font-family:var(--f-jp)}

/* section tabs */
.sections{display:flex;justify-content:center;margin:0 0 22px}
.sections .seg button{padding:8px 18px;font-size:15px}
.sections .seg .n{font-size:12px;opacity:.7;margin-left:6px;font-variant-numeric:tabular-nums}

/* top bar */
.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin-bottom:22px}
.bar h1{font-family:var(--f-title);font-weight:500;font-size:clamp(20px,3.2vw,26px);margin:0;text-align:center;text-wrap:balance}
.bar .right{justify-self:end;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pill{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 16px;font-size:14px;white-space:nowrap}
@media (hover:hover){.pill:hover{border-color:var(--ink-2)}}
.pill.on{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
.back{justify-self:start;border:1px solid var(--line);background:transparent;border-radius:999px;padding:9px 18px;font-size:15px;white-space:nowrap}
@media (hover:hover){.back:hover{background:var(--paper)}}

/* home */
.hero{text-align:center;margin:8px 0 18px}
.hero h1{font-family:var(--f-title);font-weight:500;font-size:clamp(28px,5vw,40px);margin:0 0 6px;letter-spacing:-.01em}
.hero p{color:var(--muted);margin:0}
.hero .kana{font-family:var(--f-jp-display);color:var(--ochre);font-size:15px;letter-spacing:.2em;margin-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ch{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:start;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
@media (hover:hover){.ch:hover{border-color:var(--ink-2);box-shadow:var(--shadow)}}
.ch .num{grid-row:span 3;font-family:var(--f-title);font-size:30px;line-height:1;color:var(--ochre);min-width:1.5em;font-variant-numeric:tabular-nums}
.ch .t{font-weight:600;line-height:1.35}
.ch .meta{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch .meta.kj{font-family:var(--f-jp-display);font-size:17px;color:var(--ink-2);letter-spacing:.08em;white-space:normal;line-height:1.5}
.ch .prog{height:4px;border-radius:4px;background:var(--paper-2);overflow:hidden;margin-top:6px}
.ch .prog i{display:block;height:100%;background:var(--good);width:0}
.tools{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.tools .note{font-size:13px;color:var(--muted)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--paper);flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 14px;font-size:14px;white-space:nowrap}
.seg button.on{background:var(--navy);color:var(--on-navy)}
.subbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:0 auto 16px;max-width:760px}
.chk{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--ink-2);cursor:pointer;user-select:none}
.subtitle{text-align:center;color:var(--muted);margin:-14px 0 18px;font-size:14px}
.pass{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:5px 12px}
.pass b{color:var(--ochre);font-weight:600}

/* furigana cover */
.fg{display:inline-flex;flex-direction:column;align-items:center;vertical-align:bottom;gap:2px}
.fg-r{position:relative;display:inline-block;vertical-align:bottom;min-width:3.2em;height:1.5em;padding:0 6px;border-radius:6px;cursor:pointer;font-family:var(--f-jp);color:var(--ochre);font-size:.42em;line-height:1.5em;text-align:center;user-select:none;-webkit-user-select:none;overflow:visible}
.fg-r .fg-t{display:block;height:1.5em;line-height:1.5em;opacity:0;filter:blur(6px);transform:translateY(4px);transition:opacity .35s ease,filter .35s ease,transform .35s ease;white-space:nowrap}
.fg-r .fg-c{position:absolute;left:0;top:0;right:0;bottom:0;box-sizing:border-box;border-radius:6px;background:repeating-linear-gradient(135deg,var(--cover) 0 6px,var(--cover-2) 6px 12px);border:1px dashed var(--dash);transition:transform .4s cubic-bezier(.3,1.4,.5,1),opacity .3s ease;transform-origin:50% 0}
.fg-r:hover .fg-c{transform:translateY(-2px)}
.fg-r.open .fg-c{transform:translateY(-70%) rotateX(70deg);opacity:0}
.fg-r.open .fg-t{opacity:1;filter:none;transform:none}
.fg-r.plain{cursor:default}
.fg-r.plain .fg-c{display:none}
.fg-r.plain .fg-t{opacity:1;filter:none;transform:none}
.fg-w{font-family:var(--f-jp-display);font-weight:600;line-height:1.15}
ruby.fs{ruby-position:over;ruby-align:center}
ruby.fs rt{font-size:.55em;line-height:1.2;padding-bottom:1px}
ruby.fs .fg-r{font-size:1em;min-width:1em;height:1.4em;line-height:1.4em;padding:0 2px;vertical-align:bottom;font-weight:400}
ruby.fs .fg-r .fg-t{height:1.4em;line-height:1.4em}
.ex-front.jp,.field .v.jp,.row .ex .j,.big-jp,.row .p,.bk .head{line-height:2.2}

/* flashcard */
.stage{max-width:760px;margin:0 auto}
.card{perspective:1600px;cursor:pointer;min-height:420px;display:grid}
.card .in{position:relative;display:grid;transition:transform .5s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.card.flip .in{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:26px clamp(18px,4vw,36px);display:flex;flex-direction:column;min-width:0}
.face.back-f{transform:rotateY(180deg)}
.face .top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;gap:8px}
.face .mid{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px;padding:18px 0}
.face .hint{font-size:12px;color:var(--muted);text-align:center}
.big-jp{font-family:var(--f-jp-display);font-size:clamp(34px,7vw,56px);font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.big-kanji{font-family:var(--f-jp-display);font-size:clamp(90px,20vw,140px);font-weight:600;line-height:1}
.big-vn{font-family:var(--f-title);font-size:clamp(22px,4.2vw,30px);font-weight:500;line-height:1.3;text-wrap:balance}
.hvtag{font-family:var(--f-body);color:var(--ochre);font-size:14px;letter-spacing:.1em;font-weight:600}
.ex-front{font-size:16px;color:var(--ink-2);max-width:36em}
.ex-front.jp{font-size:17px}
.struct{font-family:var(--f-jp);color:var(--ochre);font-size:14px;border:1px dashed var(--dash);border-radius:8px;padding:3px 10px;display:inline-block}
.bk{display:flex;flex-direction:column;gap:14px;padding-top:14px}
.bk .head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 14px;padding-bottom:12px;border-bottom:1px dashed var(--dash)}
.bk .head .p{font-family:var(--f-jp-display);font-size:30px;font-weight:600;line-height:1.2}
.bk .head .fg{font-size:40px}
.bk .head .bigk{font-family:var(--f-jp-display);font-size:64px;font-weight:600;line-height:1}
.field{display:grid;grid-template-columns:7.5em minmax(0,1fr);gap:12px;align-items:baseline}
.field .k{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.field .v{min-width:0;overflow-wrap:anywhere}
.field .v.jp{font-size:17px}
.field .v.vn{color:var(--ink-2)}
.field .v.m{font-weight:600;font-size:17px}
.rd{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.mid .rd{justify-content:center}
.rd .lab{font-size:12px;color:var(--muted)}
.exl{display:flex;flex-direction:column;gap:8px}
.exi{display:flex;flex-wrap:wrap;align-items:flex-end;gap:4px 12px}
.exi .fg{font-size:24px}
.exi .em{color:var(--ink-2);font-size:14px;padding-bottom:2px}
.exi .src{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 6px;margin-bottom:3px}
mark{background:transparent;color:var(--ochre);font-weight:600}

.ctrls{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.nav{display:flex;gap:8px;align-items:center}
.round{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--paper);font-size:18px;display:grid;place-items:center}
@media (hover:hover){.round:hover{border-color:var(--ink-2)}}
.count{font-variant-numeric:tabular-nums;color:var(--ink-2);min-width:4.5em;text-align:center}
.bar-prog{height:3px;background:var(--line);border-radius:3px;margin-top:14px;overflow:hidden;display:flex}
.bar-prog i{display:block;height:100%;background:var(--navy);transition:width .25s}
.know{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:9px 16px;font-size:14px}
.know.on{background:var(--good-bg);color:var(--good);border-color:var(--good)}
.keys{font-size:12px;color:var(--muted);text-align:center;margin-top:12px}
kbd{font-family:var(--f-body);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:11px;background:var(--paper)}
.empty{text-align:center;padding:60px 20px;color:var(--muted);background:var(--paper);border:1px solid var(--line);border-radius:18px}
.done{text-align:center;padding:48px 20px;background:var(--paper);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;gap:12px;align-items:center}
.done h2{font-family:var(--f-title);font-weight:500;margin:0}

/* list */
.list{max-width:880px;margin:0 auto;background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{padding:16px 24px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .up{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 24px;align-items:end}
.row .up.dash{padding-bottom:12px;border-bottom:1px dashed var(--dash)}
.row .no{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.row .p{font-family:var(--f-jp-display);font-size:24px;font-weight:600;line-height:1.3;display:flex;flex-wrap:wrap;align-items:flex-end;gap:4px 10px}
.row .p .fg{font-size:26px}
.row .p .hv{font-family:var(--f-body);font-size:12px;font-weight:500;color:var(--ochre);padding-bottom:4px}
.row .p .struct{font-size:12px;font-weight:400;border:0;padding:0;font-family:var(--f-jp)}
.row .m{font-size:15px;padding-bottom:4px}
.row .m.hid{color:transparent;background:var(--paper-2);border-radius:6px;cursor:pointer;user-select:none;position:relative}
.row .m.hid::after{content:"Nhấn để xem nghĩa";color:var(--muted);font-size:13px;position:absolute;left:10px;top:50%;transform:translateY(-50%)}
.row .ex{padding-top:10px;font-size:14px;overflow-wrap:anywhere}
.row .ex .j{font-family:var(--f-jp);color:var(--ink-2)}
.row .ex .v{color:var(--muted)}
.row.known .no::after{content:" · đã thuộc";color:var(--good)}
.krow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 20px;align-items:start}
.krow .kc{font-family:var(--f-jp-display);font-size:52px;font-weight:600;line-height:1.1;text-align:center;min-width:1.2em}
.krow .kinfo{display:flex;flex-direction:column;gap:8px;min-width:0}
.krow .khead{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.krow .khead .hv{color:var(--ochre);font-weight:600;letter-spacing:.08em}
.krow .exl .fg{font-size:20px}


.swipe-hint{display:none}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translateX(-50%);background:var(--navy);color:var(--on-navy);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:calc(100vw - 32px);text-align:center;box-shadow:var(--shadow)}
.native-only{display:none}
.is-native .native-only{display:inline-flex}
@media (hover:none){.keys{display:none}.swipe-hint{display:block}}
@media (max-width:620px){
  body{font-size:15px}
  .wrap{padding-block:max(14px,env(safe-area-inset-top)) calc(env(safe-area-inset-bottom) + 24px)}
  .hero{margin:4px 0 14px}
  .hero h1{font-size:30px}
  .sections{margin-bottom:14px}
  .sections .seg{width:100%;display:grid;grid-template-columns:repeat(4,1fr)}
  .sections .seg button{padding:9px 6px;font-size:14px}
  .sections .seg .n{display:block;margin:0}
  .tools .note{font-size:12px}
  .grid{grid-template-columns:1fr;gap:8px}
  .ch{padding:12px 14px;gap:2px 12px}
  .ch .num{font-size:24px}
  .bar{grid-template-columns:auto 1fr;grid-template-areas:"back right" "title title";gap:8px;margin-bottom:12px}
  .bar .back{grid-area:back;padding:8px 14px;font-size:14px}
  .bar .right{grid-area:right}
  .bar .right .pill{padding:8px 14px}
  .bar h1{grid-area:title;font-size:19px}
  .subtitle{margin:-4px 0 12px;font-size:13px}
  .subbar{gap:8px;margin-bottom:10px}
  .subbar .seg{flex:1 1 100%;display:grid;grid-template-columns:1fr 1fr}
  .subbar .pass{flex:1 1 100%;justify-content:center}
  .chk{font-size:13px}
  .chk input{width:18px;height:18px}
  .card{min-height:calc(100svh - 330px);min-height:max(340px,calc(100dvh - 330px))}
  .face{padding:18px 16px;border-radius:16px}
  .big-jp{font-size:clamp(30px,9vw,44px)}
  .bk{gap:10px;padding-top:10px}
  .bk .head .p{font-size:24px}
  .bk .head .bigk{font-size:52px}
  .field{grid-template-columns:1fr;gap:2px}
  .field .v.m{font-size:16px}
  /* thumb-reach control bar */
  .ctrls{position:sticky;bottom:0;z-index:5;margin:12px -16px 0;padding:10px 16px calc(env(safe-area-inset-bottom) + 10px);background:var(--bg);border-top:1px solid var(--line)}
  .nav{gap:6px}
  .round{width:48px;height:48px}
  .know{padding:12px 14px;flex:1;max-width:200px}
  .swipe-hint{font-size:12px;color:var(--muted);text-align:center;margin:8px 0 0}
  .list{border-radius:12px}
  .row{padding:14px 16px}
  .row .up{grid-template-columns:1fr;gap:4px}
  .row .p{font-size:22px}
  .krow{gap:4px 14px}
  .krow .kc{font-size:42px}
  .toast{bottom:calc(env(safe-area-inset-bottom) + 100px)}
}
@media (max-width:360px){
  .bar .right .pill{padding:7px 10px;font-size:13px}
  .count{min-width:3.6em}
}
@media (prefers-reduced-motion:reduce){.card .in,.fg-r .fg-c,.fg-r .fg-t{transition:none}}

/* review tab */
.seg button[data-sec="r"] { position: relative; }
.rev-badge { display:inline-block;background:var(--ochre);color:var(--on-navy);border-radius:999px;font-size:11px;padding:1px 6px;margin-left:5px;font-weight:600;vertical-align:middle; }
.ch.rev-g  { border-left: 3px solid var(--good);   }
.ch.rev-v  { border-left: 3px solid var(--ochre);  }
.ch.rev-k  { border-left: 3px solid var(--navy);   }


/* Review tab & Unmastered groups styling */
.unit-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: var(--paper-2);
  color: var(--ochre);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 2px 10px;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  vertical-align: middle;
  transition: all .2s;
}
.unit-chip:hover {
  background: var(--navy);
  color: var(--on-navy);
  border-color: var(--navy);
}
.ch.ch-unlearned {
  background: var(--paper);
  border: 2px dashed var(--ochre);
  padding: 16px 18px;
  margin-bottom: 12px;
  grid-column: 1 / -1;
}
.ch.ch-unlearned:hover {
  border-color: var(--ink);
  box-shadow: var(--shadow);
}
.ch.rev-all { border-left: 4px solid var(--ochre); }
.ch.rev-g   { border-left: 4px solid var(--good); }
.ch.rev-v   { border-left: 4px solid var(--ochre); }
.ch.rev-k   { border-left: 4px solid var(--navy); }
.rev-badge {
  display: inline-block;
  background: var(--ochre);
  color: var(--on-navy);
  border-radius: 999px;
  font-size: 11px;
  padding: 1px 6px;
  margin-left: 5px;
  font-weight: 600;
  vertical-align: middle;
}

</style>
</head>
<body>

<script>

const SECTIONS = {
  v:{name:'Từ vựng', unitWord:'Trang', units:[]},
  g:{name:'Ngữ pháp', unitWord:'Chương', units:[]},
  k:{name:'Kanji', unitWord:'Nhóm', units:[]}
};

GRAMMAR.forEach(c=>SECTIONS.g.units.push({
  n:c.n, t:c.t,
  items:c.items.map(x=>({...x, key:'g'+x.id, _sec:'g', unitN:c.n, unitT:c.t}))
}));

VOCAB.forEach(x=>{
  let u=SECTIONS.v.units.find(u=>u.n===x.page);
  if(!u){u={n:x.page, items:[]}; SECTIONS.v.units.push(u)}
  u.items.push({...x, key:'v'+x.n, _sec:'v', unitN:x.page, unitT:'Trang '+x.page});
});
SECTIONS.v.units.forEach(u=>u.t=`Từ ${u.items[0].n}–${u.items[u.items.length-1].n}`);

KANJI.forEach(x=>{
  let u=SECTIONS.k.units.find(u=>u.n===x.g);
  if(!u){u={n:x.g, items:[]}; SECTIONS.k.units.push(u)}
  u.items.push({...x, key:'k'+x.k, _sec:'k', unitN:x.g, unitT:'Nhóm '+x.g});
});
SECTIONS.k.units.forEach(u=>u.t=`${u.items.length} chữ Hán`);

const total = s => s==='r' ? (SECTIONS.r.units[0]?SECTIONS.r.units[0].items.length:0) : SECTIONS[s].units.reduce((a,u)=>a+u.items.length,0);

SECTIONS.r = {name:'Ôn tập', unitWord:'Nhóm', units:[]};
function buildReviewUnits(){
  const gItems = SECTIONS.g.units.flatMap(u=>u.items).filter(x=>!known.has(x.key));
  const vItems = SECTIONS.v.units.flatMap(u=>u.items).filter(x=>!known.has(x.key));
  const kItems = SECTIONS.k.units.flatMap(u=>u.items).filter(x=>!known.has(x.key));
  const allItems = [].concat(gItems, vItems, kItems);
  SECTIONS.r.units = [
    {n:0, t:'Tất cả chưa thuộc (Tổng hợp)', _sec:'all', items:allItems},
    {n:1, t:'Ngữ pháp chưa thuộc', _sec:'g', items:gItems},

    {n:3, t:'Kanji chưa thuộc',    _sec:'k', items:kItems}

}

/* ---------- helpers ---------- */
const hasKanji = s => /[一-鿿々]/.test(s||'');
// furigana block: reading covered above the word
function fg(reading, word, {open=false}={}){
  if(!hasKanji(word)) return `<span class="fg"><span class="fg-w">${esc(word||reading)}</span></span>`;
  return `<span class="fg"><span class="fg-r${open?' plain':''}" ${open?'':'tabindex="0" role="button" aria-label="Hiện cách đọc"'}><span class="fg-c"></span><span class="fg-t">${esc(reading)}</span></span><span class="fg-w">${esc(word)}</span></span>`;
}
function coreOf(p){ return p.replace(/^N \+ /,'').replace(/[〜~]/g,'').split(/[…\/]/)[0].trim(); }
function hl(sentence,p){
  const s=esc(sentence), c=coreOf(p);
  if(c.length<2) return s;
  for(let n=c.length;n>=2;n--){const sub=esc(c.slice(0,n));const at=s.indexOf(sub);if(at>=0)return s.slice(0,at)+'<mark>'+sub+'</mark>'+s.slice(at+sub.length);}
  return s;
}
// text with covered furigana over every kanji word; optional highlight of the grammar core
function fr(segs, p, {open=false}={}){
  const plain=segs.map(s=>s[0]).join('');
  let a=-1,b=-1;
  if(p){ const c=coreOf(p); if(c.length>=2) for(let n=c.length;n>=2;n--){const at=plain.indexOf(c.slice(0,n)); if(at>=0){a=at;b=at+n;break;}} }
  let pos=0, out='';
  for(const [s,r] of segs){
    const st=pos, en=pos+s.length; pos=en;
    if(r){
      const html=`<ruby class="fs">${esc(s)}<rt><span class="fg-r${open?' plain':''}" ${open?'':'tabindex="0" role="button" aria-label="Hiện cách đọc"'}><span class="fg-c"></span><span class="fg-t">${esc(r)}</span></span></rt></ruby>`;
      out += (st<b && en>a) ? `<mark>${html}</mark>` : html;
    } else {
      const i1=Math.max(a,st)-st, i2=Math.min(b,en)-st;
      if(a<0 || i2<=0 || i1>=s.length) out+=esc(s);
      else out+=esc(s.slice(0,i1))+'<mark>'+esc(s.slice(i1,i2))+'</mark>'+esc(s.slice(i2));
    }
  }
  return out;
}

function originLink(x){
  const s = x._sec || S.sec;
  const n = x.unitN != null ? x.unitN : (s==='g'?x.id:(s==='v'?x.page:x.g));
  if(n == null) return '';
  const secName = {g:'Ngữ pháp', v:'Từ vựng', k:'Kanji'}[s] || '';
  const uWord = {g:'Chương', v:'Trang', k:'Nhóm'}[s] || 'Nhóm';
  const label = `${secName} · ${uWord} ${n}`;
  return `<button class="unit-chip" onclick="event.stopPropagation(); go('${s}', ${n})" title="Chuyển đến ${label}">📍 ${label}</button>`;
}

function unit(){
  if(S.sec === 'r'){
    return SECTIONS.r.units.find(u => u.n === S.unit) || SECTIONS.r.units[0];
  }
  if(S.unit === 0){
    const items = SECTIONS[S.sec].units.flatMap(u => u.items).filter(x => !known.has(x.key));
    const labelWord = S.sec === 'g' ? 'mẫu ngữ pháp' : (S.sec === 'v' ? 'từ' : 'chữ');
    return {
      n: 0,
      t: `Tổng hợp chưa thuộc (${items.length} ${labelWord})`,
      _sec: S.sec,
      items: items
    };
  }
  return SECTIONS[S.sec].units.find(u=>u.n===S.unit);
}

function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function buildDeck(doShuffle){
  const u = unit();
  if(!u){ S.deck = []; S.i = 0; S.flip = false; return; }
  let items = u.items.slice();
  if(S.onlyNew) items = items.filter(x=>!known.has(x.key));
  const effSec = u._sec || S.sec;
  if(effSec === 'g'){
    if(doShuffle) shuffle(items);
    S.deck = items.map(x=>({x, dir:S.gdir, _sec:'g'}));
  } else if(effSec === 'all'){
    if(doShuffle) shuffle(items);
    const a = doShuffle ? shuffle(items.slice()) : items.slice();
    const b = doShuffle ? shuffle(items.slice()) : items.slice();
    S.deck = a.map(x=>({x, dir:'jv', pass:1, _sec:x._sec || S.sec}))
      .concat(b.map(x=>({x, dir:'vj', pass:2, _sec:x._sec || S.sec})));
  } else {
    const a = doShuffle ? shuffle(items.slice()) : items.slice();
    const b = doShuffle ? shuffle(items.slice()) : items.slice();
    S.deck = a.map(x=>({x, dir:'jv', pass:1, _sec:effSec}))
      .concat(b.map(x=>({x, dir:'vj', pass:2, _sec:effSec})));
  }
  S.i=0; S.flip=false;
}

function go(sec,u){
  if(sec) { S.sec=sec; store.set('n2-sec',sec); }
  S.unit=u??null; S.flip=false;
  buildReviewUnits();
  if(S.unit!=null) buildDeck(false);
  try{ history.replaceState(null,'', S.unit==null ? '#'+S.sec : '#'+S.sec+S.unit); }catch(e){}
  render(); window.scrollTo(0,0);
}

/* ---------- render ---------- */
function render(){
  const app=$('#app');
  if(S.unit==null) return renderHome(app);
  const u=unit(), sec=SECTIONS[S.sec];
  if(!u) return renderHome(app);
  
  let title;
  if(S.sec === 'r'){
    title = `Ôn tập · ${esc(u.t)}`;
  } else if(S.unit === 0){
    title = `${sec.name} · Tổng hợp chưa thuộc`;
  } else if(S.sec === 'g'){
    title = `Chương ${u.n} — ${esc(u.t)}`;
  } else {
    title = `${sec.name} · ${sec.unitWord} ${u.n}`;
  }
  const dsec = u._sec || S.sec;
  const typeWord = dsec === 'g' ? 'mẫu ngữ pháp' : (dsec === 'v' ? 'từ' : (dsec === 'k' ? 'chữ' : 'mục'));
  
  app.innerHTML = `
    <div class="bar">
      <button class="back" id="back" aria-label="Quay lại">← <span class="bk-l">${sec.name}</span></button>
      <h1>${title}</h1>
      <div class="right">
        <button class="pill ${S.mode==='card'?'on':''}" data-mode="card">Thẻ</button>
        <button class="pill ${S.mode==='list'?'on':''}" data-mode="list">Danh sách</button>
      </div>
    </div>
    <p class="subtitle">${u.items.length} ${typeWord} · đã thuộc ${u.items.filter(x=>known.has(x.key)).length}</p>
    <div id="body"></div>`;
  $('#back').onclick=()=>go(S.sec,null);
  app.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{S.mode=b.dataset.mode;store.set('n2-mode',S.mode);S.flip=false;render();});
  S.mode==='card'?renderCard($('#body')):renderList($('#body'));
}

function renderHome(app){
  buildReviewUnits();
  const sec=SECTIONS[S.sec];
  const isR = S.sec === 'r';
  const n = isR ? SECTIONS.r.units.reduce((a,u)=>a+u.items.length,0) : total(S.sec);
  const k = isR ? 0 : sec.units.reduce((a,u)=>a+u.items.filter(x=>known.has(x.key)).length,0);
  const sub = {v:'Từ vựng Mimikara N2',g:'Ngữ pháp TRY! N2',k:'Kanji N2',r:'Tổng hợp chưa thuộc'}[S.sec];

  app.innerHTML = `
    <header class="hero">
      <div class="kana">にほんご・N2</div>
      <h1>Ôn luyện N2</h1>
      <p>${sub} · ${sec.units.length} ${sec.unitWord.toLowerCase()} · đã thuộc ${k}/${n}</p>
    </header>
    <nav class="sections"><div class="seg" role="tablist">

        return `<button role="tab" class="${S.sec===s?'on':''}" data-sec="${s}">${SECTIONS[s].name}<span class="n">${cnt}</span>${s!=='r'&&unlCnt>0?`<span class="rev-badge" title="${unlCnt} chưa thuộc">${unlCnt}</span>`:''}</button>`;
      }).join('')}
    </div></nav>
    <div class="tools">
      <span class="note">${isR ? 'Ôn lại các mục chưa thuộc từ tất cả các phần. Mỗi thẻ có liên kết tới nhóm gốc.' : (S.sec==='g'?'Chọn một chương để học bằng thẻ hoặc xem danh sách.':'Thẻ chạy 2 lượt: lượt 1 Nhật → Việt, lượt 2 Việt → Nhật.')}</span>
      <button class="pill native-only" id="upd">Cập nhật file HTML</button>
      ${!isR ? `<button class="pill" id="reset" ${k?'':'hidden'}>Xoá đánh dấu đã thuộc (${sec.name})</button>` : ''}
    </div>

    ${!isR && unlearnedInSec > 0 ? `
    <button class="ch ch-unlearned" data-u="0" style="width:100%;cursor:pointer">
      <span class="num" style="color:var(--ochre)">★</span>
      <span class="t" style="color:var(--ochre);font-weight:600">Nhóm chưa thuộc (Tổng hợp) <span style="font-weight:400;color:var(--muted);font-size:13px">· ${unlearnedInSec} ${S.sec==='g'?'mẫu':S.sec==='v'?'từ':'chữ'}</span></span>
      <span class="meta">Tổng hợp toàn bộ các ${S.sec==='g'?'mẫu':S.sec==='v'?'từ':'chữ'} chưa thuộc trong phần ${sec.name}</span>
      <span class="prog"><i style="width:0%"></i></span>
    </button>` : ''}

    <div class="grid">${sec.units.map(u=>{
      const kn=u.items.filter(x=>known.has(x.key)).length;
      let meta;
      const dsec = isR ? u._sec : S.sec;
      if(dsec==='k') meta=`<span class="meta kj">${u.items.slice(0,10).map(x=>esc(x.k)).join('')}${u.items.length>10?'…':''}</span>`;
      else if(dsec==='v') meta=`<span class="meta">${u.items.slice(0,4).map(x=>esc(x.w||x.k)).join('、')}…</span>`;
      else if(dsec==='all') meta=`<span class="meta">${u.items.length} mục · Tổng hợp Ngữ pháp, Từ vựng, Kanji</span>`;
      else meta=`<span class="meta">${u.items.length} mẫu · ${u.items.slice(0,3).map(x=>esc(x.p)).join('、')}…</span>`;
      
      const t = isR 
        ? `<span style="font-weight:600">${esc(u.t)}</span> <span style="font-weight:400;color:var(--muted);font-size:13px">· ${u.items.length} mục</span>`
        : (S.sec==='g'?esc(u.t):`${sec.unitWord} ${u.n} <span style="font-weight:400;color:var(--muted);font-size:13px">· ${esc(u.t)}</span>`);
      
      const num = isR ? {'all':'★','g':'NP','v':'TV','k':'KJ'}[u._sec] : u.n;
      const revClass = isR ? ` rev-${u._sec}` : '';
      return `<button class="ch${revClass}" data-u="${u.n}"><span class="num">${num}</span><span class="t">${t}</span>${meta}<span class="prog"><i style="width:${u.items.length?kn/u.items.length*100:0}%"></i></span></button>`;
    }).join('')}</div>`;

  app.querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>go(b.dataset.sec,null));
  app.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>go(S.sec,+b.dataset.u));
  $('#upd').onclick=()=>{ nativeSend('update'); toast('Đóng màn hình học (nút Close) để chọn file HTML mới'); };
  const r=$('#reset'); let armed=false;
  if(r) r.onclick=()=>{ if(!armed){armed=true;r.textContent='Nhấn lần nữa để xoá';setTimeout(()=>{armed=false;r.textContent=`Xoá đánh dấu đã thuộc (${sec.name})`},3000);return;}
    [...known].filter(x=>x[0]===S.sec).forEach(x=>known.delete(x)); saveKnown(); render(); };
}

/* ---------- card faces ---------- */
function faces(x,dir,effSec){
  effSec = effSec || x._sec || S.sec;
  const jv = dir==='jv';
  const origin = originLink(x);

  if(effSec==='g'){
    const front = jv ? `<div class="big-jp">${fr(x.pf,null,{open:true})}</div><div class="ex-front jp">${fr(x.jf,x.p,{open:true})}</div>`
                     : `<div class="big-vn">${esc(x.m)}</div><div class="ex-front">${esc(x.v)}</div>`;
    const back = `
      <div class="head"><span class="p">${fr(x.pf,null,{open:true})}</span><span class="struct">${fr(x.sf,null,{open:true})}</span></div>
      <div class="field"><span class="k">Ý nghĩa</span><span class="v m">${esc(x.m)}</span></div>
      <div class="field"><span class="k">Ví dụ Nhật</span><span class="v jp">${fr(x.jf,x.p,{open:true})}</span></div>
      <div class="field"><span class="k">Ví dụ Việt</span><span class="v vn">${esc(x.v)}</span></div>
      <div class="field"><span class="k">Nhóm gốc</span><span class="v">${origin}</span></div>`;
    return {front, back, q: jv?'Nghĩa là gì?':'Mẫu ngữ pháp nào?', label: origin || ('Mẫu '+x.id)};
  }
  if(effSec==='v'){
    const word = x.w || x.k;
    const front = jv
      ? `<div class="big-jp"><span class="fg"><span class="fg-w">${esc(word)}</span></span></div>`
      : `<div class="big-vn">${esc(x.m)}</div>`;
    const back = `
      <div class="head"><span class="p">${fg(x.k, word, {open:true})}</span>${x.hv?`<span class="hvtag">${esc(x.hv)}</span>`:''}</div>
      <div class="field"><span class="k">Ý nghĩa</span><span class="v m">${esc(x.m)}</span></div>
      <div class="field"><span class="k">Cách đọc</span><span class="v jp">${esc(x.k)}</span></div>
      ${x.hv?`<div class="field"><span class="k">Âm Hán</span><span class="v">${esc(x.hv)}</span></div>`:''}
      <div class="field"><span class="k">Nhóm gốc</span><span class="v">${origin}</span></div>`;
    return {front, back, q: jv?'Nghĩa là gì?':'Từ tiếng Nhật là gì?', label: origin || ('Từ '+x.n)};
  }
  // kanji
  const front = jv
    ? `<div class="big-kanji">${esc(x.k)}</div><div class="hint">Đoán âm Hán Việt và nghĩa · lật thẻ để xem âm đọc</div>`
    : `<div class="hvtag" style="font-size:22px">${esc(x.hv)}</div><div class="big-vn">${esc(x.m)}</div>`;
  const back = `
    <div class="head"><span class="bigk">${esc(x.k)}</span><span class="hvtag" style="font-size:18px">${esc(x.hv)}</span></div>
    <div class="field"><span class="k">Ý nghĩa</span><span class="v m">${esc(x.m)}</span></div>
    <div class="field"><span class="k">Âm đọc</span><span class="v">${readingsOpen(x)}</span></div>
    <div class="field"><span class="k">Ví dụ</span><span class="v">${exListOpen(x)}</span></div>
    <div class="field"><span class="k">Nhóm gốc</span><span class="v">${origin}</span></div>`;
  return {front, back, q: jv?'Âm Hán Việt & nghĩa?':'Chữ Hán nào?', label: origin || ('Nhóm '+x.g)};
}

function readings(x){
  const tag=(r)=>`<span class="fg"><span class="fg-r" tabindex="0" role="button" aria-label="Hiện âm đọc" style="font-size:15px"><span class="fg-c"></span><span class="fg-t">${esc(r)}</span></span></span>`;
  return `<span class="rd">${x.on.length?`<span class="lab">On</span>${x.on.map(tag).join('')}`:''}${x.kun.length?`<span class="lab">Kun</span>${x.kun.map(tag).join('')}`:''}</span>`;
}
function readingsOpen(x){
  const tag=(r)=>`<span class="fg"><span class="fg-r plain" style="font-size:15px"><span class="fg-c"></span><span class="fg-t">${esc(r)}</span></span></span>`;
  return `<span class="rd">${x.on.length?`<span class="lab">On</span>${x.on.map(tag).join('')}`:''}${x.kun.length?`<span class="lab">Kun</span>${x.kun.map(tag).join('')}`:''}</span>`;
}
function exList(x){
  return `<span class="exl">${x.ex.map(e=>`<span class="exi">${fg(e.r,e.w)}<span class="em">${esc(e.m)}</span>${e.src?'<span class="src">Mimikara</span>':''}</span>`).join('')}</span>`;
}
function exListOpen(x){
  return `<span class="exl">${x.ex.map(e=>`<span class="exi">${fg(e.r,e.w,{open:true})}<span class="em">${esc(e.m)}</span>${e.src?'<span class="src">Mimikara</span>':''}</span>`).join('')}</span>`;
}

function renderCard(el){
  const n=S.deck.length, cur=S.deck[S.i];
  const curSec = cur ? (cur._sec || (unit() ? unit()._sec : S.sec)) : S.sec;
  const isG = curSec==='g';
  const controls = `
    <div class="subbar">
      ${isG ? `<div class="seg" role="group" aria-label="Chiều thẻ">
          <button class="${S.gdir==='jv'?'on':''}" data-dir="jv">Nhật → Việt</button>
          <button class="${S.gdir==='vj'?'on':''}" data-dir="vj">Việt → Nhật</button></div>`
        : `<span class="pass">${cur?`Lượt <b>${cur.pass}/2</b> · ${cur.dir==='jv'?'Nhật → Việt':'Việt → Nhật'}`:'2 lượt: Nhật → Việt, rồi Việt → Nhật'}</span>`}
      <label class="chk"><input type="checkbox" id="onlyNew" ${S.onlyNew?'checked':''}> Chỉ thẻ chưa thuộc</label>
      <button class="pill" id="shuffle">Trộn thẻ</button>
    </div>`;
  if(!n){ el.innerHTML = controls+`<div class="stage"><div class="empty">Bạn đã thuộc hết phần này.<br>Bỏ chọn “Chỉ thẻ chưa thuộc” để ôn lại.</div></div>`; bindCardCtrls(); return; }
  if(S.i>=n){
    el.innerHTML = controls+`<div class="stage"><div class="done"><h2>Xong cả 2 lượt</h2><p style="margin:0;color:var(--muted)">Bạn đã đi hết ${n/2} thẻ theo cả hai chiều.</p><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><button class="pill" id="again">Học lại từ đầu</button><button class="pill on" id="again-new">Chỉ ôn thẻ chưa thuộc</button></div></div></div>`;
    bindCardCtrls();
    $('#again').onclick=()=>{S.onlyNew=false;buildDeck(false);render();};
    $('#again-new').onclick=()=>{S.onlyNew=true;buildDeck(true);render();};
    return;
  }
  const x=cur.x, F=faces(x,cur.dir,curSec);
  const half=isG?n:n/2;
  const posInPass = isG? S.i+1 : (cur.pass===1? S.i+1 : S.i+1-half);
  el.innerHTML = controls + `
    <div class="stage">
      <div class="card ${S.flip?'flip':''}" id="card" tabindex="0" role="button" aria-label="Lật thẻ">
        <div class="in">
          <section class="face">
            <div class="top"><span>${F.label}</span><span>${F.q}</span></div>
            <div class="mid">${F.front}</div>
            <div class="hint">Nhấn vào thẻ để lật</div>
          </section>
          <section class="face back-f">
            <div class="top"><span>${F.label}</span><span>${known.has(x.key)?'Đã thuộc':'Mặt sau'}</span></div>
            <div class="bk">${F.back}</div>
          </section>
        </div>
      </div>
      <div class="bar-prog">${isG?`<i style="width:${(S.i+1)/n*100}%"></i>`:`<i style="width:${Math.min(S.i+1,half)/n*100}%"></i><i style="width:${Math.max(0,S.i+1-half)/n*100}%;background:var(--ochre)"></i>`}</div>
      <div class="ctrls">
        <div class="nav">
          <button class="round" id="prev" aria-label="Thẻ trước">←</button>
          <span class="count">${posInPass} / ${half}</span>
          <button class="round" id="next" aria-label="Thẻ sau">→</button>
        </div>
        <button class="know ${known.has(x.key)?'on':''}" id="know">${known.has(x.key)?'✓ Đã thuộc':'Đánh dấu đã thuộc'}</button>
      </div>
      <p class="swipe-hint">Chạm để lật · vuốt trái/phải để chuyển thẻ</p>
      <p class="keys"><kbd>Space</kbd> lật · <kbd>←</kbd> <kbd>→</kbd> chuyển thẻ · <kbd>K</kbd> đã thuộc</p>
    </div>`;
  const card=$('#card'); let sx=0,sy=0,swiped=false;
  card.addEventListener('touchstart',e=>{const p=e.changedTouches[0];sx=p.clientX;sy=p.clientY;swiped=false;},{passive:true});
  card.addEventListener('touchend',e=>{const p=e.changedTouches[0];const dx=p.clientX-sx,dy=p.clientY-sy;
    if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)*1.3){swiped=true;move(dx<0?1:-1);}},{passive:true});
  card.addEventListener('click',e=>{ if(swiped){swiped=false;return;} if(e.target.closest('.fg-r') || e.target.closest('.unit-chip')) return; flip(); });
  $('#prev').onclick=()=>move(-1);
  $('#next').onclick=()=>move(1);
  $('#know').onclick=toggleKnown;
  bindCardCtrls();
}
function bindCardCtrls(){
  document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{S.gdir=b.dataset.dir;store.set('tryn2-dir',S.gdir);buildDeck(false);render();});
  const on=$('#onlyNew'); if(on) on.onchange=e=>{S.onlyNew=e.target.checked;buildDeck(false);render();};
  const sh=$('#shuffle'); if(sh) sh.onclick=()=>{buildDeck(true);render();};
}
function flip(){ S.flip=!S.flip; const c=$('#card'); if(c) c.classList.toggle('flip',S.flip); }
function move(d){
  const n=S.deck.length; if(!n) return;
  const cur=S.deck[S.i];
  const curSec = cur ? (cur._sec || (unit() ? unit()._sec : S.sec)) : S.sec;
  const isG = curSec==='g';
  if(!isG && d>0 && S.i===n-1){ S.i=n; S.flip=false; render(); return; }
  S.i=(Math.min(S.i,n-1)+d+n)%n; S.flip=false; render();
}
function toggleKnown(){
  const cur=S.deck[S.i]; if(!cur) return;
  const k=cur.x.key; known.has(k)?known.delete(k):known.add(k); saveKnown();
  const keep=S.flip; render(); if(keep){S.flip=true;$('#card')?.classList.add('flip');}
}

/* ---------- list ---------- */
function renderList(el){
  const u=unit(), uSec = u ? u._sec : S.sec;
  const isG = uSec==='g';
  el.innerHTML = `
    <div class="subbar" style="max-width:880px">
      <label class="chk"><input type="checkbox" id="hideM" ${S.hideMeaning?'checked':''}> Ẩn nghĩa để tự kiểm tra</label>
      <label class="chk"><input type="checkbox" id="showFg" ${S.showAllFg?'checked':''}> Hiện hết hiragana</label>
    </div>
    <div class="list">${u.items.map(x=>rowHTML(x)).join('')}</div>`;
  $('#hideM').onchange=e=>{S.hideMeaning=e.target.checked;render();};
  const sf=$('#showFg'); if(sf) sf.onchange=e=>{S.showAllFg=e.target.checked; document.querySelectorAll('.list .fg-r').forEach(r=>r.classList.toggle('open',S.showAllFg));};
  el.querySelectorAll('.m.hid').forEach(m=>m.onclick=()=>m.classList.remove('hid'));
  if(S.showAllFg) el.querySelectorAll('.fg-r').forEach(r=>r.classList.add('open'));
}

function rowHTML(x){
  const hid = S.hideMeaning?' hid':'';
  const kn = known.has(x.key)?' known':'';
  const rowSec = x._sec || (S.sec==='r'?(unit()?unit()._sec:'v'):S.sec);
  const origin = originLink(x);

  if(rowSec==='g') return `
    <article class="row${kn}">
      <div class="up dash"><div><div class="no">Mẫu ${x.id} &nbsp;${origin}</div><div class="p">${fr(x.pf)} <span class="struct">(${fr(x.sf)})</span></div></div>
      <div class="m${hid}">${esc(x.m)}</div></div>
      <div class="ex"><div class="j">${fr(x.jf,x.p)}</div><div class="v">${esc(x.v)}</div></div>
    </article>`;
  if(rowSec==='v'){
    const word=x.w||x.k;
    return `
    <article class="row${kn}">
      <div class="up"><div><div class="no">Từ ${x.n} &nbsp;${origin}</div><div class="p">${fg(x.k,word)}${x.hv?`<span class="hv">(${esc(x.hv)})</span>`:''}</div></div>
      <div class="m${hid}">${esc(x.m)}</div></div>
    </article>`;
  }
  return `
    <article class="row${kn}">
      <div class="krow"><div class="kc">${esc(x.k)}</div>
        <div class="kinfo">
          <div class="khead"><span class="hv">${esc(x.hv)}</span><span class="m${hid}" style="padding:2px 8px">${esc(x.m)}</span> &nbsp;${origin}</div>
          ${readings(x)}
          ${exList(x)}
        </div></div>
    </article>`;
}

/* ---------- global events ---------- */
document.addEventListener('click',e=>{
  const r=e.target.closest('.fg-r'); if(!r||r.classList.contains('plain')) return;
  e.stopPropagation(); r.classList.toggle('open');
},true);
document.addEventListener('keydown',e=>{
  const r=e.target.closest && e.target.closest('.fg-r');
  if(r && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); e.stopPropagation(); r.classList.toggle('open'); return; }
  if(S.unit==null||S.mode!=='card'||e.target.tagName==='INPUT') return;
  if(e.key===' '||e.key==='Enter'){e.preventDefault();flip();}
  else if(e.key==='ArrowRight') move(1);
  else if(e.key==='ArrowLeft') move(-1);
  else if(e.key==='k'||e.key==='K') toggleKnown();
});

function route(){
  buildReviewUnits();
  const m=location.hash.match(/^#([vgkr])(\d+)?$/);
  if(m && (SECTIONS[m[1]] || m[1]==='r')){
    const sec = m[1];
    const u = m[2] != null ? +m[2] : null;
    let ok = false;
    if(u === null) ok = true;
    else if(u === 0) ok = true;
    else if(SECTIONS[sec] && SECTIONS[sec].units.some(x=>x.n===u)) ok = true;
    if(sec===S.sec && (ok?u:null)===S.unit) return;
    go(sec, ok ? u : null);
    return true;
  }
}
window.addEventListener('hashchange',route);
buildReviewUnits();
if(!route()) render();
</script>

<script>if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});</script>
</body>
</html>
